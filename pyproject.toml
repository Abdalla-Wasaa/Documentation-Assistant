[project]
name = "documentation-helper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "black>=26.10.1",
    "fastapi>=0.162.0",
    "isort>=9.0.2",
    "jinja2>=3.1.6",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.3",
    "langchain-openrouter>=0.2.9",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "nltk>=3.10.4",
    "openai>=3.39.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "streamlit-chat>=0.1.1",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.1",
    "unstructured>=0.27.35",
    "uvicorn>=0.54.0",
]

[project.scripts]
documentation-helper = "documentation_helper:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
